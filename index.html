<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusBoard</title>
</head>
<body>
    <main>
        <h1>FocusBoard</h1>
        <p>Organize your work, one task at a time.</p>

        <form>
            <label for="task-input">New task</label>
            <input id="task-input" type="text" placeholder="What needs doing?">
            <button type="submit">Add task</button>
        </form>

        <h2>Tasks</h2>
        <ul>
            <li>Build the first version of FocusBoard</li>
        </ul>
    </main>
</body>
</html>
