<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>FocusBored</title>
</head>
<body>
    <main>
        <h1>FocusBoard</h1>
        <p>Organize your work, one task at a time.</p>

        <form id="task-form">
            <label for="task-input">New task</label>
            <input id="task-input" type="text" placeholder="What needs doing?">
            <button type="submit">Add task</button>
        </form>

        <h2>Tasks</h2>
        <p id="task-count">1 task remaining</p>
        <ul id="task-list">
            <li>Build the first version of FocusBoard</li>
        </ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
