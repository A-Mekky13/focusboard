<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>FocusBoard</title>
</head>
<body>
    <main>
        <h1>FocusBoard</h1>
        <p>Organize your work, one task at a time.</p>

        <form id="task-form">
            <label for="task-input">New task</label>
            <input id="task-input" type="text" placeholder="What needs doing?">
            <button type="submit">Add task</button>
        </form>

        <div id="task-filters" aria-label="Filter tasks">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>
        
        <h2>Tasks</h2>
        <p id="task-count">1 task remaining</p>
        <ul id="task-list">
            <li>Build the first version of FocusBoard</li>
        </ul>
        <button id="clear-completed" type="button">Clear completed</button>
    </main>
    <script src="app.js"></script>
</body>
</html>
